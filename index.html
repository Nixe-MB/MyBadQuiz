<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyBadQuiz – Exam Reviewer</title>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<meta name="description" content="MyBadQuiz: a free exam reviewer with quizzes, flashcards, boss battles and online races. For educational use.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#" aria-label="MyBadQuiz home"><img src="assets/icon.svg" alt="" width="30" height="30"><span>MyBadQuiz</span></a>
  <nav id="nav">
    <button data-tab="subjects" class="on">Subjects</button>
    <button data-tab="practice">Practice</button>
    <button data-tab="arena">Arena</button>
    <button data-tab="cards">Cards</button>
    <button data-tab="library">Library</button>
    <button data-tab="history">History</button>
    <button data-tab="about">About</button>
  </nav>
  <div class="tools"><button id="kb" aria-label="Command palette (Ctrl+K)">⌕</button><button id="cfg" aria-label="Settings">⚙</button><button id="mute" aria-label="Toggle sound">🔊</button><button id="theme" aria-label="Toggle light/dark theme">☾</button></div>
</header>
<main id="app"></main>
<footer class="foot">MyBadQuiz is a student-made study aid for educational use only. Not an official school product. Always verify answers with your handouts.</footer>
<div id="modal" class="modal" hidden></div>

<!-- SUBJECT DATA: add a new <script> line per subject file in /data -->
<script src="data/csa.js"></script>
<script src="data/lcd.js"></script>
<script src="data/ddc.js"></script>
<script src="data/fmss.js"></script>
<!-- ENGINE -->
<script src="js/fx.js"></script>
<script src="js/app.js"></script>
<script src="js/boss.js"></script>
<script src="js/versus.js"></script>
<script src="js/about.js"></script>
</body>
</html>
